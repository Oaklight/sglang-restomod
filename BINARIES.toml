# Pinned out-of-repo artefacts for the SM70 serving stack.
#
# Path-free on purpose: this file is committed. Site paths live in
# `restomod.site.toml`, which is site-local and named by
# `RESTOMOD_SITE_CONFIG`. `restomod doctor` reads this file and fails when a
# present artefact does not match its hash, or when a selected component's
# artefact is absent.
#
# Each row answers four questions: what it is, where it came from, which
# component needs it, and what silently breaks without it.
#
# Licence rule: nothing is promoted to `ship` until a licence text is in hand.
# `license = "unverified"` means exactly that, not "probably fine".
version = 1

[[artefact]]
name = "sm70-turbomind-v100"
kind = "shared-library"
sha256 = "fab255d13010ff92cb5e848b631c936764aca38d8543ea9595c70c814bffa613"
size = 11059216
consumers = ["fp8_dense", "fp8_lm_head", "fp8_dense_quant"]
silent_break = "the three components register and do nothing; dense falls back to bf16"
license = "unverified"
provenance = { repo = "https://github.com/dg1kjd/sglang-sxm2", commit = "73abfe1dd7e7aae7a62b222a201e48f532fb298e" }
resolve = { site_path = "turbomind_so" }
produce = { kind = "copy", note = "built in the fork tree; no public URL yet. Do not redistribute until the licence is established." }

