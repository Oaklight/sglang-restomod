name: restomod-patch-guard

on:
  pull_request:
    paths:
      - "patches/**"
      - "UPSTREAM_PIN.toml"
      - "scripts/**"
      - "sglang_restomod/**"
      - ".github/workflows/restomod-patch-guard.yml"
  push:
    branches: [main]
    paths:
      - "patches/**"
      - "UPSTREAM_PIN.toml"
      - "scripts/**"
      - "sglang_restomod/**"
      - ".github/workflows/restomod-patch-guard.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check without a source tree
        if: ${{ hashFiles('patches/*.patch') == '' }}
        run: |
          python scripts/check_pin.py
          python scripts/check_patches.py --skip-apply

      - name: Fetch the pin and check patches
        if: ${{ hashFiles('patches/*.patch') != '' }}
        run: |
          python scripts/check_pin.py
          scripts/fetch_upstream.sh
          python scripts/check_patches.py
          scripts/apply_patches.sh
