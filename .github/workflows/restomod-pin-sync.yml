name: restomod-pin-sync

on:
  push:
    branches: [main]
  workflow_dispatch:

# Read-only: this job verifies the reference branch, it does not move it. The
# move needs a credential that may push workflow files, which a GITHUB_TOKEN
# cannot be granted; see scripts/move_upstream.sh.
permissions:
  contents: read

concurrency:
  group: restomod-pin-sync
  cancel-in-progress: false

jobs:
  restomod-pin-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check the reference upstream branch against the pin
        run: scripts/move_upstream.sh --check
