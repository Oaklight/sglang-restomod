name: delta-guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pin consistency
        run: python scripts/check_pin.py

      - name: Reject unrecorded core patches
        run: python v100_plus/check-core-diff.py --ref HEAD
