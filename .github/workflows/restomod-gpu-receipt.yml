name: restomod-gpu-receipt

# Verifies a receipt signed on the GPU host, where GitHub cannot run the job.
# The operator runs the suite, packs evidence, signs one statement, and posts
# it as a PR comment or dispatches this workflow with it.
#
# The check name "gpu-receipt" is public API: branch protection matches it.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: PR number used for the summary comment; 0 disables it
        required: false
        default: "0"
      commit:
        description: Commit SHA the receipt names
        required: true
      receipt:
        description: Signed receipt block, pasted in full
        required: true
        type: string
      evidence-url:
        description: HTTPS URL of the evidence .tar.gz; empty uses the receipt's claim
        required: false
        default: ""
      require-evidence:
        description: Require the evidence archive; false accepts the signed digest only
        required: false
        default: "true"

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  policy:
    # A receipt arrives as a PR comment, so re-run on a comment that carries one.
    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request != null &&
       contains(github.event.comment.body, '<!-- receipt:v1 -->'))
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.context.outputs.pr }}
      commit: ${{ steps.context.outputs.commit }}
      requires: ${{ steps.paths.outputs.requires }}
    steps:
      - name: Resolve the PR and its head commit
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
          INPUT_COMMIT: ${{ inputs.commit }}
        run: |
          pr="$PR_NUMBER"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            commit="$INPUT_COMMIT"
          else
            commit="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr" --jq .head.sha)"
          fi
          echo "pr=$pr" >> "$GITHUB_OUTPUT"
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

      - name: Decide whether this change needs a GPU receipt
        id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ steps.context.outputs.pr }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            # A comment or a dispatch is an explicit request to verify.
            echo "requires=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A receipt is evidence about GPU behaviour, so a documentation change
          # has nothing for it to certify. Without the markdown filter a typo fix
          # in PROVENANCE.md or a recipe note could never merge: the path prefix
          # matched, no run could produce the evidence, and the only way through
          # was to bundle an unrelated code change with it.
          # The rule is about GPU behaviour at serving time, so it names the
          # trees that decide it rather than the whole package. A change to
          # cli.py (the doctor command) or to tests cannot make a served kernel
          # compute something else, and requiring a hardware run for it costs a
          # window for evidence that has nothing to certify. plugins.py stays in
          # the list: a component that fails to load there leaves a server that
          # starts normally and serves on the engine's own kernels, which is the
          # failure this gate exists for.
          #
          # The triggering files are printed into the job summary. Without that
          # the check reports `unverified` with no way to see which path made
          # the receipt required, which is the same opacity one level up.
          files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files?per_page=100" \
               --jq '.[].filename')"
          triggering="$(printf '%s\n' "$files" \
               | grep -vE '\.md$' \
               | grep -E '^(sglang_restomod/(quant|attention|moe|models|spec|linear_attn_sm70)/|sglang_restomod/plugins\.py$|patches/|recipes/)' \
               || true)"
          if [ -n "$triggering" ]; then
            echo "requires=true" >> "$GITHUB_OUTPUT"
          else
            echo "requires=false" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "### GPU receipt policy"
            echo
            if [ -n "$triggering" ]; then
              echo "**requires=true** — these paths decide GPU behaviour:"
              echo
              echo '```'
              printf '%s\n' "$triggering"
              echo '```'
            else
              echo "**requires=false** — nothing in this change can alter what the GPU computes at serving time."
            fi
            echo
            echo 'Rule: `sglang_restomod/{quant,attention,moe,models,spec,linear_attn_sm70}/`, `sglang_restomod/plugins.py`, `patches/`, `recipes/`; `.md` files are always exempt.'
          } >> "$GITHUB_STEP_SUMMARY"

  verified:
    needs: policy
    permissions:
      contents: read
      checks: write
      pull-requests: write
    uses: Oaklight/out-of-band/.github/workflows/verify.yml@354998f9db40b1835bfcdb17279a6301ca6c6678 # v0.5.0
    with:
      pr: ${{ needs.policy.outputs.pr }}
      commit: ${{ needs.policy.outputs.commit }}
      job: gpu-bench
      required: ${{ needs.policy.outputs.requires == 'true' }}
      check-name: gpu-receipt
      trusted-authors: Oaklight
      receipt: ${{ inputs.receipt }}
      evidence-url: ${{ inputs.evidence-url }}
      # PR and comment events always require evidence; a manual dispatch may
      # opt out for a digest-only dry run.
      require-evidence: ${{ github.event_name != 'workflow_dispatch' || inputs.require-evidence == 'true' }}
