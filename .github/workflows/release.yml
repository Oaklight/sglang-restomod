name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.0.0a0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify version matches __init__.py
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          PKG_VER=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' sglang_restomod/__init__.py)
          echo "Package version: $PKG_VER"
          echo "Requested version: $INPUT_VERSION"
          [ "$PKG_VER" = "$INPUT_VERSION" ] || \
            (echo "::error::Version mismatch: __init__.py has $PKG_VER but release requested $INPUT_VERSION"; exit 1)

      - name: Build wheel + sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Create the release tag
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="$INPUT_VERSION"
          TAG="restomod-v$VERSION"
          ver_of() { sed -n 's/^__version__ = "\(.*\)"/\1/p'; }
          INIT=sglang_restomod/__init__.py
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists - verifying it."
            TAG_COMMIT=$(git rev-parse "$TAG^{commit}")
            HEAD_COMMIT=$(git rev-parse HEAD)
            [ "$TAG_COMMIT" = "$HEAD_COMMIT" ] || \
              (echo "::error::Tag $TAG points to $TAG_COMMIT, not $HEAD_COMMIT; dispatch from the tag for a back-release"; exit 1)
            PKG_VER=$(git show "$TAG:$INIT" | ver_of)
            echo "Version at $TAG: $PKG_VER"
            [ "$PKG_VER" = "$VERSION" ] || \
              (echo "::error::Version mismatch: $TAG has $PKG_VER but release requested $VERSION"; exit 1)
          else
            echo "Creating $TAG."
            PKG_VER=$(ver_of < "$INIT")
            echo "Version in working tree: $PKG_VER"
            [ "$PKG_VER" = "$VERSION" ] || \
              (echo "::error::Version mismatch: __init__.py has $PKG_VER but release requested $VERSION"; exit 1)
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          retention-days: 7

  github-release:
    needs: build-publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          TAG="restomod-v$INPUT_VERSION"
          REPO="${{ github.repository }}"
          PRE=""
          case "$INPUT_VERSION" in
            *a*|*b*|*rc*|*dev*) PRE="--prerelease" ;;
          esac
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" dist/* --repo "$REPO" \
              --title "$TAG" --generate-notes $PRE
          fi
