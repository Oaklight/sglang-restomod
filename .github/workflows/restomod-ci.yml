name: restomod-ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restomod-ci:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the layer without its engine dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --no-deps

      - name: Compile
        run: python -m compileall -q sglang_restomod scripts

      - name: README parity
        run: cmp README.md README_en.md

      - name: Pin and manifest consistency
        run: |
          python scripts/check_pin.py
          python scripts/check_patches.py --skip-apply

      - name: Build sdist and wheel
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*

      - name: Install the built wheel in a clean venv
        run: |
          python -m venv /tmp/wheel-test
          /tmp/wheel-test/bin/pip install --no-deps dist/*.whl
          /tmp/wheel-test/bin/python -c "import sglang_restomod; print(sglang_restomod.__file__)"
