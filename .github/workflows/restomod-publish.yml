name: restomod-publish

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        required: true
        default: testpypi
        type: choice
        options:
          - testpypi
          - pypi
          - both
      version:
        description: "Optional PEP 440 version override (test publishes). Empty uses pyproject.toml."
        required: false
        default: ""
        type: string
  push:
    tags:
      - "restomod-v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply version override
        if: github.event_name == 'workflow_dispatch' && inputs.version != ''
        env:
          VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          path = pathlib.Path("pyproject.toml")
          text = path.read_text()
          new, count = re.subn(
              r'^version = ".*"$',
              f'version = "{os.environ["VERSION"]}"',
              text,
              count=1,
              flags=re.M,
          )
          if count != 1:
              raise SystemExit("could not find the project version")
          path.write_text(new)
          print("version:", os.environ["VERSION"])
          PY

      - name: Build
        run: |
          python -m pip install --upgrade build
          python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    if: >
      github.event_name == 'workflow_dispatch' &&
      (inputs.target == 'testpypi' || inputs.target == 'both')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

      - name: Smoke-install from TestPyPI
        run: |
          python -m venv /tmp/tp
          /tmp/tp/bin/pip install \
            --pre \
            --index-url https://test.pypi.org/simple/ \
            --no-deps sglang-restomod
          /tmp/tp/bin/python -c "import sglang_restomod; print(sglang_restomod.__file__)"

  publish-pypi:
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/restomod-v')) ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'pypi' || inputs.target == 'both'))
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
