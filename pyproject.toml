[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sglang-restomod"
dynamic = ["version"]
description = "A lightweight downstream layer for SGLang: pinned upstream plus selected V100/SM70 components."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
keywords = ["sglang", "v100", "sm70", "inference", "serving"]
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  # The baseline. When patches exist, scripts/build.sh installs a patched
  # source tree at the same version instead of this wheel.
  "sglang==0.5.22",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "build>=1.2"]

[project.urls]
Repository = "https://github.com/Oaklight/sglang-restomod"
Issues = "https://github.com/Oaklight/sglang-restomod/issues"

[project.entry-points."sglang.srt.plugins"]
restomod = "sglang_restomod:register"

[tool.setuptools.dynamic]
version = { attr = "sglang_restomod.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["sglang_restomod*"]

# Native sources are read or JIT-compiled at runtime, so they have to travel
# with the wheel. Without this the wheel installs and then fails on first use.
# `kernels/sm70_longctx_decode.cu` is generated from the pinned submodule by
# `scripts/sync_kernels.py`, which also writes SHA256SUMS next to it; the
# TileLang paged extend kernel (`attention/v100/tilelang/_kernels_paged.py`) is
# generated from the same pin the same way. CI cannot run that check: the
# submodule repository is private. Run `python scripts/sync_kernels.py --check`
# locally after touching the kernel.
[tool.setuptools.package-data]
"sglang_restomod.attention.v100" = ["kernels/*.cu", "kernels/SHA256SUMS", "PROVENANCE.md"]
"sglang_restomod.attention.lsa_sm70" = ["PROVENANCE.md"]
"sglang_restomod.quant.sm70_fp8_moe" = ["*.cpp", "README.md"]
"sglang_restomod.quant.sm70_fp4_moe" = ["PROVENANCE.md"]
"sglang_restomod.quant.sm70_fp4_dense" = ["PROVENANCE.md"]
"sglang_restomod.quant.sm70_marlin_v100" = ["patches/*.patch", "patches/README.md"]
"sglang_restomod.spec" = ["cccl/cuda/functional"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "gpu: requires a CUDA device and the SM70 TurboMind library",
]
