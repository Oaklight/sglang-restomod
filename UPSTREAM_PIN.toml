# The upstream baseline this layer targets.
#
# `upstream` is a reference branch in this repository containing the
# pristine SGLang tree at this commit. `main` does not merge it; it only
# carries the layer, the patches, and the pin.
#
# `scripts/upstream_bump.py` updates this file and patches/manifest.json.

[upstream]
repo = "sgl-project/sglang"
kind = "tag"
ref = "v0.5.23"
commit = "297e54fd105e974cdf401e5b4d20253a22c16f90"
pypi_version = "0.5.23"
pinned_at = "2026-11-06"


# Kernel sources are not vendored by hand any more. They arrive through a git
# submodule pinned to a commit (the repository has no tags) and are copied into
# the package at build time by scripts/sync_kernels.py, which also records
# SHA256SUMS next to the `.cu` files. `--check` fails on any drift.
[kernels]
repo = "https://github.com/Oaklight/sm70-kernels.git"
commit = "bdf1e56a3c46f39c03b85f69856ae95834ee564a"
path = "third_party/sm70-kernels"

[[kernels.files]]
source = "sm70_kernels/longctx_decode/csrc/sm70_longctx_decode.cu"
dest = "sglang_restomod/attention/v100/kernels/sm70_longctx_decode.cu"
sha256 = "3038250394ab872958e09a3eb98be914e471da8b99f5c4f199ccfc90b31b0b2f"

# The paged extend kernel is Python. Its copy under the package is generated,
# not edited: change sm70-kernels, bump this pin, then run the sync script.
[[kernels.files]]
source = "sm70_kernels/tilelang_fa/_kernels_paged.py"
dest = "sglang_restomod/attention/v100/tilelang/_kernels_paged.py"
sha256 = "f12b45d6a1f67de2e4a3f6598d92dc58332b20eb7b1044d9f4e4a97690dd8b1a"

# Latent Sparse Attention is not vendored either. The standalone package is the
# only implementation; the `lsa_sm70` component in this repository is a shim
# that registers it. scripts/check_pin.py compares the installed version when
# the package is present.
[lsa]
repo = "https://github.com/Oaklight/lsa-sm70.git"
commit = "3a4798093224933988175ee685084d521474da0b"
version = "0.1.0"
